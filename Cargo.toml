[package]
name = "devinventory"
version = "0.1.0"
edition = "2024"

[lib]
name = "devinventory"
path = "src/lib.rs"

[[bin]]
name = "devinventory-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10.1", features = ["alloc"] }
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "4.5.53", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
dirs = "6.0.0"
env_logger = "0.11.6"
log = "0.4.22"
rand = "0.9.2"
ratatui = { version = "0.30.0", optional = true }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = [
  "chrono",
  "macros",
  "runtime-tokio",
  "sqlite",
  "uuid"
] }
tabled = "0.20.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
toml = "0.9.8"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3.23.0"

[features]
default = []
tui = ["dep:crossterm", "dep:ratatui"]
